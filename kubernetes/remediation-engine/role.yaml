apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: remediation-engine,namespace: self-healing}
rules:
- apiGroups: ["apps"]
  resources: ["deployments","deployments/scale"]
  verbs: ["get","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: remediation-engine,namespace: self-healing}
subjects:
- kind: ServiceAccount
  name: remediation-engine
roleRef: {kind: Role,name: remediation-engine,apiGroup: rbac.authorization.k8s.io}
