apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-service
  namespace: self-healing
spec:
  replicas: 2
  selector:
    matchLabels: {app: demo-service}
  template:
    metadata: {labels: {app: demo-service}}
    spec:
      serviceAccountName: demo-service
      containers:
      - name: demo
        image: self-healing/demo-service:1.0
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        envFrom: [{configMapRef: {name: demo-config}}]
        readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10, periodSeconds: 10}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 250m, memory: 128Mi}
